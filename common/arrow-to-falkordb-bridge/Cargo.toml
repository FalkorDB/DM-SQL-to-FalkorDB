[package]
name = "arrow-to-falkordb-bridge"
version = "0.1.0"
edition = "2021"
description = "Shared Arrow RecordBatch → LogicalRow conversion and OpenDAL storage helpers for FalkorDB loaders"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false, features = ["chrono-tz"] }
arrow-array = "60"
arrow-schema = "60"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
opendal = { version = "0.54", features = ["services-fs", "services-s3", "services-gcs", "services-azblob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[profile.release]
opt-level = 3
