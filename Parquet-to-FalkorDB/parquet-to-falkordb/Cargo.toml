[package]
name = "parquet-to-falkordb"
version = "0.1.0"
edition = "2021"
description = "Load and sync Parquet files (local or object storage) into FalkorDB"
license = "MIT"

[dependencies]
anyhow = "1"
arrow = { version = "60", default-features = false }
arrow-array = "60"
arrow-schema = "60"
arrow-to-falkordb-bridge = { path = "../../common/arrow-to-falkordb-bridge" }
bytes = "1"
chrono = { version = "0.4", features = ["serde", "clock"] }
clap = { version = "4", features = ["derive", "env"] }
falkordb = { version = "0.9.0", features = ["tokio"] }
futures = "0.3"
glob = "0.3"
hyper = { version = "0.14", features = ["server", "http1", "tcp"] }
once_cell = "1.19"
opendal = { version = "0.54", features = ["services-fs", "services-s3", "services-gcs", "services-azblob"] }
# default-features are disabled to drop the CLI/json extras we don't need, but all
# compression codec features must be re-enabled explicitly: the `parquet` crate ships
# with zero codec support otherwise, and real-world Parquet files (PyArrow/Spark/Hive/
# Trino writers) are virtually always compressed, most commonly with Snappy.
parquet = { version = "60", default-features = false, features = ["arrow", "async", "snap", "brotli", "flate2-rust_backend", "lz4", "zstd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "fs", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
