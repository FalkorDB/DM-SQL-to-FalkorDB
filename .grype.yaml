# Grype configuration for the nightly security scan
# (.github/workflows/nightly-security-scan.yml).
#
# There are intentionally no ignore rules. The control-plane image used to
# suppress Go-ecosystem findings (stdlib, golang.org/x/net, golang.org/x/text)
# in the vendored /usr/local/bin/kubectl binary, because the upstream release
# binary bundles whatever Go toolchain and modules the Kubernetes release
# pinned. kubectl is now built from source in control-plane/Dockerfile (stage
# `kubectl-build`) with a patched Go toolchain and patched modules, so those
# findings are reported again and must be fixed, not ignored.
#
# Grype ignore rules do not expire and do not alert on new findings within
# their scope, so prefer fixing the dependency. If a rule is ever added here,
# scope it as narrowly as possible (package + location) and document why.
ignore: []
