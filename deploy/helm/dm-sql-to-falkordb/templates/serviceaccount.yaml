{{- if .Values.controlPlane.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dm-sql-to-falkordb.serviceAccountName" . }}
  labels:
    {{- include "dm-sql-to-falkordb.labels" . | nindent 4 }}
  {{- with .Values.controlPlane.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: {{ .Values.controlPlane.serviceAccount.automountServiceAccountToken }}
{{- end }}
{{- if and .Values.kubernetesRunner.serviceAccount.create (not .Values.kubernetesRunner.serviceAccountName) }}
---
# Dedicated, unprivileged service account for runner/scaffold pods. It is not bound to
# any Role and does not automount its token.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dm-sql-to-falkordb.runnerServiceAccountName" . }}
  namespace: {{ include "dm-sql-to-falkordb.runnerNamespace" . }}
  labels:
    {{- include "dm-sql-to-falkordb.labels" . | nindent 4 }}
    app.kubernetes.io/component: runner
  {{- with .Values.kubernetesRunner.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
