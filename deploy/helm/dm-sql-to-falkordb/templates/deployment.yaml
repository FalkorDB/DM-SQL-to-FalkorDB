apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dm-sql-to-falkordb.fullname" . }}
  labels:
    {{- include "dm-sql-to-falkordb.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controlPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "dm-sql-to-falkordb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "dm-sql-to-falkordb.selectorLabels" . | nindent 8 }}
        {{- with .Values.controlPlane.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.controlPlane.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "dm-sql-to-falkordb.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.controlPlane.serviceAccount.automountServiceAccountToken }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.priorityClassName }}
      priorityClassName: {{ . | quote }}
      {{- end }}
      {{- with .Values.controlPlane.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: control-plane
          image: {{ include "dm-sql-to-falkordb.controlPlaneImage" . }}
          imagePullPolicy: {{ .Values.images.controlPlane.pullPolicy }}
          {{- with .Values.controlPlane.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 3003
              protocol: TCP
          env:
            # kubectl caches API discovery under $HOME/.kube; keep it on the /tmp emptyDir
            # so the root filesystem can stay read-only.
            - name: HOME
              value: /tmp
            - name: CONTROL_PLANE_BIND
              value: {{ .Values.controlPlane.bindAddress | quote }}
            - name: CONTROL_PLANE_EXECUTION_BACKEND
              value: {{ .Values.controlPlane.executionBackend | quote }}
            - name: CONTROL_PLANE_DATA_DIR
              value: /var/lib/falkordb-control-plane
            - name: CONTROL_PLANE_ENABLED_TOOLS
              value: {{ include "dm-sql-to-falkordb.enabledToolsCsv" . | quote }}
            - name: CONTROL_PLANE_K8S_NAMESPACE
              value: {{ include "dm-sql-to-falkordb.runnerNamespace" . | quote }}
            - name: CONTROL_PLANE_K8S_RUNNER_IMAGE
              value: {{ include "dm-sql-to-falkordb.runnerImage" . | quote }}
            - name: CONTROL_PLANE_K8S_IMAGE_PULL_POLICY
              value: {{ .Values.kubernetesRunner.imagePullPolicy | quote }}
            - name: CONTROL_PLANE_K8S_KUBECTL_BIN
              value: kubectl
            - name: CONTROL_PLANE_K8S_BINARY_DIR
              value: {{ .Values.kubernetesRunner.binaryDir | quote }}
            - name: CONTROL_PLANE_K8S_SERVICE_ACCOUNT
              value: {{ include "dm-sql-to-falkordb.runnerServiceAccountName" . | quote }}
            # Release-specific label on runner/scaffold pods so this release's
            # NetworkPolicy never selects another release's runners.
            - name: CONTROL_PLANE_K8S_RUNNER_LABELS
              value: {{ dict "app.kubernetes.io/instance" .Release.Name | toJson | quote }}
            - name: CONTROL_PLANE_K8S_AUTOMOUNT_SERVICE_ACCOUNT_TOKEN
              value: {{ .Values.kubernetesRunner.automountServiceAccountToken | quote }}
            {{- with .Values.kubernetesRunner.podSecurityContext }}
            - name: CONTROL_PLANE_K8S_POD_SECURITY_CONTEXT
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.kubernetesRunner.securityContext }}
            - name: CONTROL_PLANE_K8S_CONTAINER_SECURITY_CONTEXT
              value: {{ toJson . | quote }}
            {{- end }}
            {{- with .Values.kubernetesRunner.resources }}
            - name: CONTROL_PLANE_K8S_RUNNER_RESOURCES
              value: {{ toJson . | quote }}
            {{- end }}
            {{- if .Values.kubernetesRunner.sharedPvc.enabled }}
            - name: CONTROL_PLANE_K8S_SHARED_PVC
              value: {{ include "dm-sql-to-falkordb.runnerSharedPvcName" . | quote }}
            {{- end }}
            {{- if (.Values.kubernetesRunner.podSecurityContext | default dict).fsGroup }}
            - name: CONTROL_PLANE_K8S_POD_FS_GROUP
              value: {{ .Values.kubernetesRunner.podSecurityContext.fsGroup | quote }}
            {{- end }}
            {{- if .Values.kubernetesRunner.envSecretName }}
            - name: CONTROL_PLANE_K8S_ENV_SECRET
              value: {{ .Values.kubernetesRunner.envSecretName | quote }}
            {{- end }}
            {{- if .Values.kubernetesRunner.envConfigMapName }}
            - name: CONTROL_PLANE_K8S_ENV_CONFIGMAP
              value: {{ .Values.kubernetesRunner.envConfigMapName | quote }}
            {{- end }}
            {{- with (include "dm-sql-to-falkordb.apiKeySecretName" .) }}
            # A key source is configured: fail startup instead of running unauthenticated
            # if the Secret value turns out to be empty.
            - name: CONTROL_PLANE_API_KEY_REQUIRED
              value: "true"
            - name: CONTROL_PLANE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ . }}
                  key: {{ include "dm-sql-to-falkordb.apiKeySecretKey" $ }}
            {{- end }}
            {{- with .Values.controlPlane.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controlPlane.resources | nindent 12 }}
          volumeMounts:
            - name: control-plane-data
              mountPath: /var/lib/falkordb-control-plane
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          {{- with (.Values.controlPlane.tmpVolume | default dict).sizeLimit }}
          emptyDir:
            sizeLimit: {{ . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: control-plane-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "dm-sql-to-falkordb.controlPlaneDataPvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.controlPlane.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controlPlane.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
