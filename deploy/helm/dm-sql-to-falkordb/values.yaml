images:
  defaultTag: ""
  controlPlane:
    registry: ghcr.io
    repository: falkordb/dm-sql-to-falkordb-control-plane
    tag: ""
    pullPolicy: IfNotPresent
  runner:
    registry: ghcr.io
    repository: falkordb/dm-sql-to-falkordb-runner
    tag: ""

tools:
  enabled:
    bigquery: true
    clickhouse: true
    databricks: true
    iceberg: true
    mariadb: true
    mysql: true
    oracle: true
    parquet: true
    postgres: true
    snowflake: true
    spark: true
    sqlserver: true

controlPlane:
  replicaCount: 1
  executionBackend: kubernetes
  bindAddress: "0.0.0.0:3003"
  apiKey: ""
  resources: {}
  extraEnv: []
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  serviceAccount:
    create: true
    name: ""
  # Pod-level securityContext for the control-plane Deployment. The control-plane image
  # runs as the non-root `appuser` (uid 10001, see control-plane/Dockerfile). Setting
  # fsGroup ensures mounted PersistentVolumeClaims (e.g. the control-plane data PVC) are
  # writable by that user, avoiding "Permission Denied" errors on first mount.
  podSecurityContext:
    fsGroup: 10001
  # Container-level securityContext for the control-plane container. Empty by default;
  # override to add e.g. runAsNonRoot, readOnlyRootFilesystem, etc.
  securityContext: {}

service:
  type: ClusterIP
  port: 3003

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dm-sql-to-falkordb.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteOnce
  size: 10Gi

kubernetesRunner:
  namespaceOverride: ""
  imagePullPolicy: IfNotPresent
  serviceAccountName: ""
  envSecretName: ""
  envConfigMapName: ""
  binaryDir: /opt/falkordb/bin
  # Pod-level securityContext applied by the control-plane to the runner Jobs/Deployments
  # it creates dynamically. The runner image runs as the non-root `runner` user (uid
  # 10002, see docker/runner.Dockerfile). Setting fsGroup ensures the shared workspace
  # PVC (below) is writable by that user.
  podSecurityContext:
    fsGroup: 10002
  sharedPvc:
    enabled: true
    existingClaim: ""
    storageClassName: ""
    accessModes:
      - ReadWriteOnce
    size: 20Gi
